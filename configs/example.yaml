# Full pipeline configuration.
# Run with:  python -m nsbi_carl.train --config configs/example.yaml

run_name: sbi_vs_ref
output_dir: outputs/sbi_vs_ref
seed: 52                          
data:
  target_paths:                   # target label 1
    - data/signal_SBI.h5
  reference_paths:                # target label 0
    - data/background_qqZZ.h5
    - data/background_ggZZ.h5
  features: [m4l, mTZZ]           
  weight_key: weight              

split:
  train_fraction: 0.8
  val_fraction: 0.1               
  k_folds: 0                      # >= 2: k-fold cross-validation (INT note 2.7.2).
                                  # Replaces the bootstrap: ensemble.n_members is then
                                  # members PER FOLD, trained without replacement on the
                                  # other k-1 folds; score MC with score_out_of_fold.
  fold_seed: 20240607             # k-fold only; MUST be identical for every template
  kfold_val_fraction: 0.2         # k-fold only; per-member validation share of the pool
  kfold_test_fraction: 0.1        # k-fold only; set aside BEFORE the folds as a final
                                  # test set no member trains or validates on

model:
  n_layers: 5
  n_nodes: 256
  dropout: 0.0
  scheduler:                      # CosineAnnealingWarmRestarts
    t0: 25                        # restart period (epochs)
    t_mult: 1                     # period multiplication factor after each restart
    eta_min: 1.0e-8

training:

  batch_size: 32768
  val_batch_size: 262144
  learning_rate: 6.0e-3
  momentum: 0.9
  optimizer: adamw                  # sgd | adam | adamw  
  weight_decay: 0.0
  max_epochs: 400
  early_stopping_patience: 30
  num_workers: 4                  # only used when performance.device_batches is false
  gpus: [0, 1, 2, 3]              
  resume_from: null               # path to a .ckpt to continue a single-model training

performance:
  device_batches: true            # keep the split on the GPU and batch by slicing.
                                  # Replaces DataLoader(Subset(...)), which makes one
  matmul_precision: high          # TF32 on the tensor cores; "highest" for strict fp32
  precision: 32-true              # bf16-mixed also works; gains are modest for tiny MLPs
  compile: false                  # torch.compile; helps most at large batch sizes
  save_last: false                # writing last.ckpt every epoch is pure IO
  checkpoint_every_n_epochs: 1
  progress_bar: true              # turn off for batch/grid jobs

ensemble:
  enabled: true
  n_members: 8
  start_seed: 100                 # member i trains with seed start_seed + i
  bootstrap: true
  bootstrap_fraction: 0.8
  start_member: 0                 # set > 0 to extend/resume an existing ensemble
  combiner: mean_score            # how member scores become one score:
                                  # mean_score | mean_ratio | mean_logit |
                                  # median_ratio | trimmed_ratio  (nsbi_carl/combine.py)
  combiner_trim: 0.1              # trimmed_ratio only: fraction cut at each end

  # "vectorized": every member assigned to a GPU trains simultaneously as one
  #   batched matmul. M members cost roughly one member's wall time, because
  #   the work per kernel launch grows while the launch count stays fixed.
  # "process": the original one-member-per-process pool (kept as a fallback).
  mode: vectorized
  members_per_group: 0            # 0 -> all of a GPU's members in one group.
                                  # Lower it only if a group runs out of memory.
  workers_per_gpu: 1              # "process" mode only

evaluation:
  during_training:                # executed at end of validation, per its own schedule
    metrics:
    plots:
      
  after_training:                 # single model: on the test split.
    metrics:                      # ensemble: once for the ENTIRE ensemble on the test split.
      - name: density_ratio_integral
    plots:
      - name: loss_curves
      - name: calibration_curve
      - name: reweighting
        kwargs: {feature: m4l}
      - name: reweighting
        kwargs: {feature: mjj, log_y: true}
